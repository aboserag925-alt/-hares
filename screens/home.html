<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إستراحة أهل الأثر</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="../app/tailwind.css" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
<style>body{background:#0e0b08;display:flex;justify-content:center}</style>
</head>
<body>

<div dir="rtl" style="width:390px;height:844px;box-sizing:border-box;background:#14100c;color:#f3e9d6;font-family:'Cairo',sans-serif;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;padding:28px 20px 0;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;gap:12px">
<img src="../assets/logo.jpg" alt="" style="width:48px;height:48px;border-radius:50%;border:2px solid #d4a24c;object-fit:cover">
<div style="flex:1"><div style="font-size:20px;font-weight:700;line-height:1.2">إستراحة أهل الأثر</div><div style="font-size:13px;color:#c2b296">مجلس تدارس العلم والأدب</div></div>
<button aria-label="التنبيهات" style="width:44px;height:44px;border-radius:50%;border:1px solid #3a2e20;background:#1f1812;color:#d4a24c;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg></button>
</div>
<div style="border-radius:18px;padding:18px;background:linear-gradient(135deg,#2e2214,#1f1812);border:1px solid #4a3a22;display:flex;flex-direction:column;gap:10px">
<div style="font-size:13px;color:#d4a24c;font-weight:600">البث القادم</div>
<div style="font-size:22px;font-weight:700;line-height:1.3">شرح كتاب التوحيد</div>
<div style="font-size:14px;color:#c2b296">الإثنين، الساعة 10 م بتوقيت مكة المكرمة</div>
<div style="display:flex;gap:10px;margin-top:4px">
<button style="flex:1;height:44px;border-radius:12px;border:0;background:#d4a24c;color:#14100c;font-weight:700;font-size:15px">شاهد على يوتيوب</button>
<button style="flex:1;height:44px;border-radius:12px;border:1px solid #d4a24c;background:transparent;color:#d4a24c;font-weight:700;font-size:15px">تيك توك</button>
</div>
</div>
<div style="font-size:16px;font-weight:700">الأقسام</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
<button style="height:84px;border-radius:14px;border:1px solid #3a2e20;background:#1f1812;color:#f3e9d6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600"><span style="color:#d4a24c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6"/></svg></span>مصطلح الحديث</button>
<button style="height:84px;border-radius:14px;border:1px solid #3a2e20;background:#1f1812;color:#f3e9d6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600"><span style="color:#d4a24c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M5 7h14"/><path d="M7 7l-3 7h6zM17 7l-3 7h6z"/></svg></span>الفقه</button>
<button style="height:84px;border-radius:14px;border:1px solid #3a2e20;background:#1f1812;color:#f3e9d6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600"><span style="color:#d4a24c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>السيرة</button>
<button style="height:84px;border-radius:14px;border:1px solid #3a2e20;background:#1f1812;color:#f3e9d6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600"><span style="color:#d4a24c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></span>منوعات</button>
<button style="height:84px;border-radius:14px;border:1px solid #3a2e20;background:#1f1812;color:#f3e9d6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600"><span style="color:#d4a24c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9"/><path d="M10 13h4"/></svg></span>الأرشيف</button>
<button style="height:84px;border-radius:14px;border:1px solid #3a2e20;background:#1f1812;color:#f3e9d6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600"><span style="color:#d4a24c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>جدول الدورات</button>
</div>
<div style="border-radius:14px;padding:14px 16px;background:#1f1812;border:1px solid #3a2e20;display:flex;align-items:center;gap:12px">
<div style="flex:1"><div style="font-size:13px;color:#d4a24c;font-weight:600">دورة اليوم · 7 – 10 مساءً</div><div style="font-size:15px;font-weight:600">شرح صحيح الإمام مسلم</div></div>
<button style="height:44px;padding:0 18px;border-radius:12px;border:1px solid #d4a24c;background:transparent;color:#d4a24c;font-weight:700;font-size:14px">ذكّرني</button>
</div>
</div>
<nav style="height:72px;border-top:1px solid #3a2e20;background:#1a1410;display:flex;align-items:center;justify-content:space-around;padding-bottom:6px">
<button style="width:80px;height:52px;border:0;background:transparent;color:#d4a24c;font-size:12px;font-weight:600">الرئيسية</button>
<button style="width:80px;height:52px;border:0;background:transparent;color:#c2b296;font-size:12px">الأقسام</button>
<button style="width:80px;height:52px;border:0;background:transparent;color:#c2b296;font-size:12px">الجدول</button>
<button style="width:80px;height:52px;border:0;background:transparent;color:#c2b296;font-size:12px">بحث</button>
</nav>
</div>

</body>
</html>
