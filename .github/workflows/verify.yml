name: Verify project

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dashboard and build script syntax
        run: node --check app/admin.js && node --check app/public-content.js && node --check scripts/build-auth.mjs

      - name: Run server tests
        run: npm test

      - name: Build application assets
        run: npm run build:app
