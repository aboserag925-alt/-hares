name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server/index.js
          node --check server/lecture-api.js
          node --check server/suggestions/suggestion-api.js
          node --check server/suggestions/suggestion-validator.js
          node --check server/ai/approval-api.js
          node --check server/ai/task-service.js
          node --check app/app.js
          node --check app/suggestions.js
          node --check app/admin-suggestions.js
          node --check app/sw.js
          node --check app/pwa-assets.test.js
          node --check scripts/build-auth.mjs
      - run: npm test
      - run: npm run build:app
      - run: docker build --tag ahl-athar:verify .
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
