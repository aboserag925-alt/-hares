name: Android app build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-capacitor-app
    paths:
      - 'app/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm ci

      - name: Build web application assets
        run: npm run build:app

      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core@^7 @capacitor/android@^7 @capacitor/cli@^7

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ahl-athar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
