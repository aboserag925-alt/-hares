name: Deploy GitHub Pages

on:
  push:
    branches: [fix/istirahat-ahl-athar]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build application assets
        run: |
          npm ci
          npm test
          npm run build:app

      - name: Prepare Pages site
        env:
          AHL_API_BASE_URL: ${{ vars.AHL_API_BASE_URL }}
        run: |
          mkdir -p _site
          cp index.html 404.html runtime-config.js _site/
          cp -R app assets screens _site/
          touch _site/.nojekyll
          node -e 'const fs = require("node:fs"); const value = (process.env.AHL_API_BASE_URL || "").trim().replace(/\/+$/, ""); if (value) { const url = new URL(value); if (url.protocol !== "https:" || url.origin !== value) throw new Error("AHL_API_BASE_URL must be an HTTPS origin without a trailing path."); } fs.writeFileSync("_site/runtime-config.js", "window.AHL_API_BASE_URL = " + JSON.stringify(value) + ";\n", "utf8"); fs.writeFileSync("_site/app/runtime-config.js", "window.AHL_API_BASE_URL = " + JSON.stringify(value) + ";\n", "utf8");'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
