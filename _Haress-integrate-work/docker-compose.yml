services:
  web:
    build:
      context: .
      args:
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_ANON_PUBLIC: ${SUPABASE_ANON_KEY:-}
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - media_storage:/srv/ahl-athar/storage
    restart: unless-stopped

volumes:
  media_storage:
